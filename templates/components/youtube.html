{% component youtube(id: string, class: string = "", title: string = "", autoplay: bool = false, @lang: string) %}
<div {% if class %}class="{{ class | escape_html }}"{% endif %} style="position:relative;aspect-ratio:16/9;width:100%;">
    <iframe
            src="https://www.youtube-nocookie.com/embed/{{ id | escape_html }}{% if autoplay %}?autoplay=1{% endif %}"
            title="{% if title %}{{ title | escape_html }}{% else %}{{ trans(key='youtube_video_label', lang=lang) }}{% endif %}"
            width="560"
            height="315"
            loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            referrerpolicy="strict-origin-when-cross-origin"
            style="position:absolute;inset:0;width:100%;height:100%;border:0;"
            allowfullscreen>
    </iframe>
</div>
{% endcomponent youtube %}
