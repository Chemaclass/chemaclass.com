ack_editor.en = "To Francisco Javier for dedicating his time to offer me ideas, suggestions, and corrections to make this book even more special."
ack_editor.es = "A Francisco Javier por haber dedicado su tiempo a ofrecerme ideas, sugerencias y correcciones para hacer de este libro algo aún más especial."
