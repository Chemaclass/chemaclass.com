# Copy for the OEUR book pages (books/about.html, books/chapters.html), English
# and Spanish side by side. Change both languages in the same edit.
# scripts/check-i18n.py fails the build on a missing language, an empty string
# or a key no template uses. Values are raw HTML (printed with `safe`).

[about]
subtitle.en = "An introspective journey through personal reflections"
subtitle.es = "Un viaje introspectivo a través de reflexiones personales"
description.en = "A compilation of thoughts structured like a diary. It's the result of moving to a new country and looking for new opportunities in life, spanning over two years of personal reflections."
description.es = "Un recopilatorio de la evolución de los pensamientos de un joven en un formato parecido al de un diario. Un trabajo de más de dos años que ha derivado en una colección de reflexiones cada cual más personal que la anterior."
buy.en = "Buy Physical Book"
buy.es = "Comprar libro físico"
language_note.en = "Published in paper in Spanish only"
language_note.es = "Publicado en papel únicamente en castellano"
quote.en = "A book dedicated only to the brave<br>For no one and for everyone"
quote.es = "Un libro dedicado sólo a los valientes<br>Para nadie y para todos"
author_title.en = "About the Author"
author_title.es = "Sobre el autor"
author.en = "José María Valera Reales is the second of eight siblings. Born in 1993 in Caravaca de la Cruz, Region of Murcia, Spain. Orphaned of his mother at eleven years old. Since 2015, he lives and works in Germany as a software developer."
author.es = "José María Valera Reales es el segundo de ocho hermanos. Nacido en 1993 en Caravaca de la Cruz, Región de Murcia, España. Huérfano de madre a los once años. Desde 2015 vive y trabaja en Alemania como programador informático."
team_title.en = "Team"
team_title.es = "Equipo"
team_editing.en = "Editing and proofreading"
team_editing.es = "Edición y corrección de textos"
team_design.en = "Cover design and illustrations"
team_design.es = "Diseño de portada e ilustraciones"
ack_title.en = "Acknowledgments"
ack_title.es = "Agradecimientos"
ack_siblings.en = "To all my siblings for being the source of my inspiration despite not seeing each other as much as we would want to. A special mention to my brother Jesús for helping me with this book's edition."
ack_siblings.es = "A mis hermanos (a todos ellos) por ser fuente de mi inspiración a pesar de no vernos tanto como quisiéramos. Especial mención a Jesús por ayudarme en la edición de este presente libro."
ack_uncles.en = "To my uncles, who provided my siblings and me with constant support for many years."
ack_uncles.es = "A mis tíos por el enorme apoyo que durante todos estos años han significado tanto para mí como para mis hermanos."
ack_illustrator.en = "To Jesús Robles for his great work in giving life to the text through his illustrations."
