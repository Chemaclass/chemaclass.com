[extra]
# Pages kept out of sitemap.xml even though they are perfectly indexable. A
# trailing * excludes everything under the path but keeps the path itself.
#
# The OEUR chapters are poetry from Chema's book, not articles written to be
# found by search. 70 of them in a 531-URL sitemap is a seventh of the crawl
# budget spent on pages nobody searches for. /books/oeur/ stays: the book is
# the thing worth ranking, and every chapter is one click from it.
sitemap_exclude = ["/books/oeur/*"]

start_here_posts = [
  "blog/2022-06-08-the-path-to-seniority-in-software.md",
  "blog/2024-03-28-effective-pair-programming.md",
  "blog/2025-10-10-ai-gives-you-speed-not-quality.md",
  "blog/2022-09-25-the-beauty-of-leadership.md",
]

nav = [
    { name = "Blog", path = "/blog/" },
    { name = "Readings", path = "/readings/" },
    { name = "CV", path = "/cv/" },
]

