base_url = "https://chemaclass.com"
default_language = "en"

title = "Chemaclass"
description = "Tech Lead sharing practical insights on software craftsmanship, TDD, leadership, Bitcoin, and AI. Blog posts, book summaries, and conference talks."
author = "Chemaclass"

generate_feeds = true
generate_sitemap = true
taxonomies = [{ name = "tags", feed = true }]
compile_sass = true
build_search_index = true

[search]
include_title = true
include_path = false
include_content = true
include_description = true
index_format = "elasticlunr_json"
truncate_content_length = 2000  # Limit content length for better performance

[markdown]
smart_punctuation = true
# Section permalinks rendered into the HTML, using templates/anchor-link.html.
# The headings always had ids; what was missing was a link to them that survives
# without JavaScript, which is what a reader copies and an agent cites.
insert_anchor_links = "right"

[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark"

[link_checker]
# Hosts that answer a browser but refuse `zola check`. Every one of these was
# verified alive by hand; they return 403, 521 or a dropped connection to an
# automated client, and reporting them as broken every run trains everyone to
# ignore the whole report. web.archive.org is here for a different reason: it
# rate-limits, so checking it turns a green run into a coin flip.
skip_prefixes = [
    "https://bitcoin.org",
    "https://hodlhodl.com",
    "https://rosettacode.org",
    "https://stackoverflow.com",
    "https://web.archive.org",
]
# Anchors these sites build at runtime, so they are never in the served HTML.
skip_anchor_prefixes = [
    "https://github.com",
    "https://x.com",
]

