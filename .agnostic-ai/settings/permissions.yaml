permissions:
  allow:
    - shell(zola build:*)
    - shell(zola check:*)
    - shell(zola serve:*)
    - shell(git status:*)
    - shell(git diff:*)
    - shell(git log:*)
    - shell(git show:*)
    - shell(git add:*)
    - shell(rtk git status:*)
    - shell(rtk git diff:*)
    - shell(rtk git log:*)
    - shell(rtk git show:*)
    - shell(scripts/build-slides.sh:*)
    - shell(bash scripts/build-slides.sh:*)
    - shell(scripts/optimize-image.sh:*)
    - shell(bash scripts/optimize-image.sh:*)
    - WebFetch(domain:chemaclass.com)
  deny:
    - shell(git push --force:*)
    - shell(git push -f:*)
    - shell(git reset --hard:*)
    - shell(git clean -f:*)
    - shell(git checkout .:*)
    - shell(git restore .:*)
    - shell(rm -rf:*)
