command:
    - input=$(cat); printf '%s' "$input" | jq -e '.tool_input.command | test("(^|[;&|] *)(rtk )?git commit")' > /dev/null 2>&1 || exit 0; dir=$(printf '%s' "$input" | jq -r '.tool_input.command' | sed -nE 's/^(rtk )?cd +([^ ;&|]+).*/\2/p' | head -1); dir=${dir:-$(printf '%s' "$input" | jq -r '.cwd')}; out=$(cd "$dir" && zola build --output-dir /tmp/zola-precommit-gate --force 2>&1) || { printf '%s\n' "$out" | tail -5 >&2; echo "zola build failed in $dir; fix errors before committing" >&2; exit 2; }
    - cmd=$(jq -r '.tool_input.command // empty'); case "$cmd" in *git\ commit*|*gh\ pr*) if printf '%s' "$cmd" | grep -q '—'; then echo 'Em dash (U+2014) is forbidden in commit/PR text (see .agnostic-ai/rules/no-em-dash.md)' >&2; exit 2; fi ;; esac; exit 0
event: PreToolUse
matcher: Bash
name: commit-gate
description: Before a git commit, build the site and block the commit on a failed build or a dash in the message.
