name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Pages deploys must not overlap; pull request builds are per ref and can be
  # superseded by a newer push to the same branch.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.0

      - name: Build site
        run: ./build.sh
        env:
          RUM_KEY: ${{ secrets.RUM_KEY }}

      # Deliberately its own step rather than part of build.sh: this is the one
      # check that needs a browser, and build.sh has to stay runnable on any
      # machine with Zola, Python and minify. Chrome is preinstalled on the
      # ubuntu runner image.
      - name: Check no page throws a JavaScript error
        run: python3 scripts/check-js-runtime.py

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    # Pull requests build only: they verify the site compiles and that the
    # post-build checks pass, without touching what is live.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # After the deploy, never before: IndexNow tells the engines to come and
      # fetch these URLs, so they have to be live by then. Google ignores the
      # protocol; Bing, Yandex, Seznam and Naver act on it within minutes.
      - name: Checkout for the IndexNow submission
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          # The submission is built from what changed in this push, so the
          # commit before it has to be in the clone.
          fetch-depth: 0

      - name: Submit changed URLs to IndexNow
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          # A new branch or a force push reports an all-zero "before" commit,
          # which is not a revision git can diff from.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="${{ github.sha }}^"
          fi
          python3 scripts/indexnow.py "$before..${{ github.sha }}"
