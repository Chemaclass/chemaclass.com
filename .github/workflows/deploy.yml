name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Pages deploys must not overlap; pull request builds are per ref and can be
  # superseded by a newer push to the same branch.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, not the default single commit. Two build steps read
          # dates out of git: the last body edit of every post
          # (scripts/generate-last-modified.py, which feeds dateModified and the
          # "Updated" stamp) and the sitemap <lastmod>. With a shallow clone
          # every file looks like it changed in the deploy commit, so the whole
          # site published today's date as its last modification.
          fetch-depth: 0

      # Zola encodes ~900 covers and thumbnails into static/processed_images and
      # skips the ones already there. A clean runner has none, and profiling this
      # job showed what that costs: 56.9s cold against 34.5s with the images
      # already encoded.
      #
      # restore-keys means a push that changes a template or adds one image still
      # starts from the previous set and re-encodes only what changed, instead of
      # all 900. What used to make that unsafe was accumulation, and
      # scripts/prune-processed-images.py now deletes anything the build stopped
      # referencing before the cache is saved.
      - name: Cache the processed images
        uses: actions/cache@v6
        with:
          path: static/processed_images
          key: processed-images-${{ hashFiles('static/images/**', 'templates/**', 'config.toml') }}
          restore-keys: |
            processed-images-

      # Zola compares timestamps, not just filenames: a source image newer than
      # its processed output is re-encoded. Checkout stamps every source with the
      # time of the clone, while the restored images keep the timestamps they were
      # archived with, so without this the cache restores 47MB and Zola re-encodes
      # all of it anyway. That is exactly what the first attempt at this did.
      - name: Mark the cached images as current
        run: |
          if [ -d static/processed_images ]; then
            find static/processed_images -type f -exec touch {} +
          fi

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.0

      - name: Build site
        run: ./build.sh
        env:
          RUM_KEY: ${{ secrets.RUM_KEY }}
          # scripts/fetch-github-stars.py reads two repos through the API.
          # Unauthenticated, from a shared runner address, that is a 403 for
          # rate limiting; with the workflow token it is two fast requests.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Deliberately its own step rather than part of build.sh: this is the one
      # check that needs a browser, and build.sh has to stay runnable on any
      # machine with Zola, Python and minify. Chrome is preinstalled on the
      # ubuntu runner image.
      - name: Check no page throws a JavaScript error
        run: python3 scripts/check-js-runtime.py

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    # Pull requests build only: they verify the site compiles and that the
    # post-build checks pass, without touching what is live.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # After the deploy, never before: IndexNow tells the engines to come and
      # fetch these URLs, so they have to be live by then. Google ignores the
      # protocol; Bing, Yandex, Seznam and Naver act on it within minutes.
      - name: Checkout for the IndexNow submission
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          # The submission is built from what changed in this push, so the
          # commit before it has to be in the clone.
          fetch-depth: 0

      - name: Submit changed URLs to IndexNow
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          # A new branch or a force push reports an all-zero "before" commit,
          # which is not a revision git can diff from.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="${{ github.sha }}^"
          fi
          python3 scripts/indexnow.py "$before..${{ github.sha }}"
